# 1. Receivers: Entry points for data (Logs, Metrics, Traces)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# 2. Processors: Modify/Enrich data before sending
processors:
  batch:
    timeout: 5s              # Batch data for 5 seconds to reduce network calls
    send_batch_size: 1024

  attributes/enrich:         # Add "deployment.platform=docker-compose" to all telemetry
    actions:
      - key: deployment.platform
        value: docker-compose
        action: upsert

  probabilistic_sampler:     # Sample 100% of traces (for MVP/Debugging)
    sampling_percentage: 100

# 3. Exporters: Where to send the processed data
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464   # Expose metrics for Prometheus to scrape

  # Send Logs to Loki via OTLP over HTTP
  # Note: The 'otlphttp' exporter is used because the 'loki' exporter is deprecated/removed in new versions
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Send Traces to Tempo via OTLP (gRPC default)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

# 4. Extensions: Helper components
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

# 5. Service: Define the pipelines (connect Receivers -> Processors -> Exporters)
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/enrich, probabilistic_sampler, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [attributes/enrich, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [attributes/enrich, batch]
      exporters: [otlphttp/loki] # Forward logs to Loki